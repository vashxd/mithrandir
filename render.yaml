# Blueprint do Render. Em "New > Blueprint" o Render le este arquivo e ja cria
# o servico com as variaveis certas. As marcadas com sync:false voce preenche
# no painel (sao segredos - nunca vao para o repositorio).
services:
  - type: web
    name: mithrandir
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Mithrandir
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: pt_BR
      - key: APP_FALLBACK_LOCALE
        value: pt_BR
      - key: APP_FAKER_LOCALE
        value: pt_BR
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # ---- Neon (Postgres) ----
      - key: DB_CONNECTION
        value: pgsql
      # Endpoint POOLED (host com -pooler): usado pelo app em runtime.
      - key: DB_URL
        sync: false
      # Endpoint DIRETO (host sem -pooler): usado so pelas migrations.
      - key: DB_MIGRATION_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ---- Cloudflare R2 (documentos) ----
      - key: UPLOAD_DISK
        value: s3
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # ---- Web push (gere com: php artisan mithrandir:vapid) ----
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
