<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sem conexao - Mithrandir</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background:#f1f5f9; color:#0f172a; padding:24px; }
        .caixa { max-width:420px; text-align:center; }
        h1 { font-size:1.4rem; margin:0 0 12px; }
        p { color:#475569; line-height:1.6; margin:0 0 20px; }
        button { min-height:44px; padding:0 20px; border:0; border-radius:12px;
                 background:#0f172a; color:#fff; font-weight:600; font-size:1rem; }
    </style>
</head>
<body>
    <div class="caixa">
        <h1>Voce esta sem conexao</h1>
        <p>
            O que voce ja abriu continua disponivel. Fotos e anotacoes feitas agora
            ficam na fila e sobem sozinhas quando o sinal voltar.
        </p>
        <button onclick="location.reload()">Tentar de novo</button>
    </div>
</body>
</html>
