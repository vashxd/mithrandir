[www]
; O supervisord sobe como root; os processos filhos trocam de UID para
; www-data mas herdam HOME=/root. A libpq procura o certificado de cliente
; em $HOME/.postgresql/postgresql.crt e, como /root e 0700, o stat retorna
; EACCES em vez de ENOENT - ela trata isso como erro fatal e derruba toda
; conexao com o Neon. Apontar HOME para um diretorio legivel resolve: o
; arquivo simplesmente nao existe la e a libpq segue sem certificado.
clear_env = no
env[HOME] = /var/www
